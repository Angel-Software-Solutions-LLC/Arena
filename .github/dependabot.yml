version: 2
updates:
  # One batched PR per ecosystem per week instead of one PR per package.
  # Security updates are not grouped by this and still arrive individually,
  # so urgent fixes are never held for the weekly batch.
  - package-ecosystem: npm
    directories:
      - /
      - /sdk/nodejs
      - /tests/browser
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-npm-updates:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /go-arena
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-go-updates:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-python-updates:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /go-arena
      - /updater
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-docker-updates:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-actions-updates:
        patterns:
          - "*"
