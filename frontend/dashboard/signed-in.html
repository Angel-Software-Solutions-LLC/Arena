<title>Signed in</title>
<!--
  Where a popup sign-in ends.

  The window that opened this one is the one the person is actually looking at,
  and by the time this page loads the session cookie is already set. So there is
  nothing to do here but say so and get out of the way — this page is never read,
  and is styled only for the moment it is visible on a slow connection, or for
  the case where it is not a popup at all and has to stand on its own.

  It deliberately does no work of its own: no fetch, no session parsing, no
  redirect logic. The opener owns all of that. A popup that tried to be clever
  would be a second place the sign-in flow could be wrong.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #0b1020; color: #e2e8f0;

    text-align: center; padding: 24px;

  .card { max-width: 30ch; }
  h1 { margin: 0 0 6px; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  p { margin: 0; color: #94a3b8; font-size: 13px; }
  a { color: #818cf8; }
</style>
</head>
